<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add Spiral Calendar to your phone's Home Screen with a short installation guide.">
  <title>Install Spiral</title>
  <style>
    :root { color-scheme: light dark; font-family: Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 2rem; min-height: 80vh; display: grid; place-items: center; }
    main { max-width: 28rem; line-height: 1.5; }
    h1 { font-size: 1.8rem; }
    a { color: LinkText; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid currentColor; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <h1>Install Spiral</h1>
    <p>The installation guide opens in Spiral and shows the steps for your device.</p>
    <p><a id="install-guide-link" href="./?install=1">Open the installation guide</a></p>
    <noscript><p>Enable JavaScript to use Spiral and its installation guide.</p></noscript>
  </main>
  <script>
    (() => {
      const incoming = new URL(window.location.href);
      const destination = new URL('./', incoming);
      destination.search = incoming.search;
      destination.searchParams.set('install', '1');
      destination.hash = incoming.hash;
      document.getElementById('install-guide-link').href = destination.href;
      window.location.replace(destination.href);
    })();
  </script>
</body>
</html>
